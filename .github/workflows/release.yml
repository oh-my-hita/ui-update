name: Release plugin
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :ui-plugin:assembleDebug
      - run: |
          cp ui-plugin/build/outputs/apk/debug/ui-plugin-debug.apk plugin.apk
          gh release create "$GITHUB_REF_NAME" plugin.apk --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
